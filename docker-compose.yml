# Local / staging docker-compose for Saphira AI
# Supports FastAPI backend + optional local model fallback later

services:
  saphira:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=docker
      - PYTHONPATH=/app
    volumes:
      # Mount only what is needed for development; remove for production images
      - ./src:/app/src:ro
      - ./agents:/app/agents:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

