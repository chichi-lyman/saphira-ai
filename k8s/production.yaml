apiVersion: v1
kind: Namespace
metadata:
  name: saphira-enterprise
  labels:
    platform: saphira-ai
    tier: control-plane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saphira-api
  namespace: saphira-enterprise
spec:
  replicas: 3
  selector:
    matchLabels:
      app: saphira-api
  template:
    metadata:
      labels:
        app: saphira-api
    spec:
      containers:
        - name: api
          image: ghcr.io/chichi-lyman/saphira-ai/saphira-core:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: saphira-runtime-secrets
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: saphira-api
  namespace: saphira-enterprise
spec:
  selector:
    app: saphira-api
  ports:
    - port: 8000
      targetPort: 8000
