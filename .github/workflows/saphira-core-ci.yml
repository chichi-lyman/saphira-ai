name: Saphira Core & Sentinel CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Core Protocol Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Code Quality Check (non-blocking style)
        run: |
          ruff check src tests --select=E9,F63,F7,F82 || true
          ruff check src tests --exit-zero || true

      - name: Execute Core Test Suite
        env:
          ENVIRONMENT: testing
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -q --tb=line || true

  docker-build-check:
    name: Container Integration Build
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Saphira Core Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: saphira-ai/core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
