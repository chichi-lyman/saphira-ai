name: Saphira P0 Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  p0-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run P0 integration tests
        run: pytest -q tests/integration
