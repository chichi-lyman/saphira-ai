name: Saphira Flutter APK Build

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-build.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-build.yml'
  workflow_dispatch:

# Backend URL is runtime-configurable in the app (Settings).
# No secrets or environment origins are baked into the APK.

jobs:
  build-flutter-apk:
    name: Build Saphira Flutter Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Ensure platform scaffolding
        working-directory: mobile
        run: |
          # Generate any missing Android embedding files without wiping lib/
          # Existing custom Kotlin (MainActivity, voice services) is preserved
          # when files already exist; flutter create only fills gaps.
          flutter create . --project-name saphira_ai --org com.saphira --platforms=android

          # Force correct source path (one level up from android/)
          if grep -q 'source = "../.."' android/app/build.gradle 2>/dev/null; then
            sed -i 's|source = "../.."|source = "../"|' android/app/build.gradle
          fi

          # Ensure assets directory exists (pubspec references it)
          mkdir -p assets
          touch assets/.gitkeep

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze (non-blocking)
        working-directory: mobile
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload Flutter release APK
        uses: actions/upload-artifact@v4
        with:
          name: saphira-flutter-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
