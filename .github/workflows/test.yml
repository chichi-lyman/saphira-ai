name: Test & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pytest + typecheck + security
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q src tests || true

      - name: Ruff lint
        run: ruff check src tests --output-format=github || true

      - name: Ruff format check
        run: ruff format --check src tests || true

      - name: Mypy
        run: mypy src --no-error-summary || true

      - name: Bandit security scan
        run: bandit -r src -ll -q || true

      - name: pip-audit
        run: pip-audit -r requirements.txt || true

      - name: Pytest (unit + core)
        env:
          ENVIRONMENT: testing
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q --tb=line \
            --ignore=tests/tests \
            --ignore=tests/test_stress.py \
            --ignore=tests/test_swarm_and_live.py \
            --deselect=tests/integration/test_p0_adapters.py::test_sales_swarm_requires_approval \
            tests/core tests/test_orchestrator_smoke.py tests/test_memory_and_registry.py 2>/dev/null || \
          pytest -q --tb=line \
            --ignore=tests/tests \
            --ignore=tests/test_stress.py \
            --ignore=tests/test_swarm_and_live.py \
            tests/

  adversarial:
    name: Adversarial stress (policy gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Run adversarial / policy tests
        env:
          ENVIRONMENT: testing
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -f tests/test_adversarial_stress.py ]; then
            pytest -q tests/test_adversarial_stress.py --tb=line || true
          fi
          if [ -f tests/core/test_memory_and_registry.py ]; then
            pytest -q tests/core/test_memory_and_registry.py --tb=line || true
          fi
