name: Copilot Setup Steps (Disabled)

# Previously this file contained a malformed YAML fragment (a single step without
# top-level name/on/jobs) that caused every push to report Failure in Actions.
# It is now a valid no-op workflow so the UI no longer shows errors.
# Real CI lives in saphira-ci.yml, saphira-core-ci.yml, and related files.

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: No-op (intentionally disabled)
        run: |
          echo "This workflow is intentionally disabled."
          echo "See .github/workflows/saphira-ci.yml and related files for active CI."
