name: Saphira Enterprise CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: saphira_enterprise
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q core finance governance mesh observability sdk storage src main.py
      - run: python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/saphira_enterprise
          REDIS_URL: redis://localhost:6379/0
      - run: pip install bandit && bandit -r core finance governance mesh observability sdk storage -ll
