name: Saphira CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-validation:
    name: Python validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run tests
        env:
          ENVIRONMENT: testing
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q --tb=line

  tiktok-integration:
    name: TikTok autopilot smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run TikTok integration smoke tests
        env:
          ENVIRONMENT: testing
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -f tests/test_tiktok_integration.py ]; then
            pytest -q tests/test_tiktok_integration.py --tb=line
          else
            echo "TikTok integration test file not present; skipping."
          fi

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    # Fixed: previous job-level hashFiles expression was rejected by the workflow parser
    # ("Unrecognized function: 'hashFiles'"). Conditional logic is now handled inside steps.
    steps:
      - uses: actions/checkout@v4
      - name: Check for Android project
        id: check-android
        run: |
          if [ -f android/settings.gradle ] || [ -f android/settings.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Java
        if: steps.check-android.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: steps.check-android.outputs.exists == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug APK
        if: steps.check-android.outputs.exists == 'true'
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload Saphira APK
        if: steps.check-android.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: saphira-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
