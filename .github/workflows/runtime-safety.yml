name: Runtime safety checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest pytest-asyncio
      - run: python -m compileall -q core src tests main.py
      - run: python -m pytest -q tests/test_integration_reliability.py tests/test_webhook_security.py tests/test_sovereign_oracle_audit.py
