name: Saphira AI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend hardening + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run regression and hardening suite
        run: pytest -q

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saphira-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Build Saphira app
        run: npm run build

  security:
    name: Security and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
        continue-on-error: true
