name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unified:
    name: Install · Lint · Security · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Unified dependency install
        run: |
          uv pip install --system -r requirements-dev.txt
          pip install -e .

      - name: Ruff
        run: ruff check packages agents src tests || true

      - name: Mypy
        run: mypy packages agents || true

      - name: Bandit
        run: bandit -r packages agents src -ll || true

      - name: pip-audit
        run: pip-audit -r requirements.txt || true

      - name: Pytest (monorepo)
        run: pytest -q --tb=short

  agents-matrix:
    name: Agent package smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - saphira
          - aura
          - agent_two
          - novareign
          - novaaethrea
          - agent_zero
          - lyra
          - apex
          - instinct
          - lexis
          - cipher
          - scholar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import agent package
        run: |
          pip install pydantic
          python -c "from agents.${{ matrix.agent }}.agent import *; print('${{ matrix.agent }} OK')"
