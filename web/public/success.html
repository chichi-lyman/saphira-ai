<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Saphira AI — Activated</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#182033;background:#f7f9fc}body{margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(680px,calc(100% - 40px));background:#fff;border:1px solid #e4e9f2;border-radius:28px;padding:48px;text-align:center;box-shadow:0 24px 80px rgba(31,38,135,.08)}.orb{width:72px;height:72px;border-radius:50%;margin:0 auto 24px;background:linear-gradient(135deg,#00bcd4,#ff007f);display:grid;place-items:center;color:#fff;font-size:30px}.gradient{background:linear-gradient(90deg,#ff007f,#00bcd4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.steps{margin:28px auto;text-align:left;background:#f7f9fc;border-radius:18px;padding:20px;max-width:480px}.steps div{padding:9px 0}.cta{display:inline-block;margin-top:12px;padding:14px 22px;border-radius:12px;background:#101522;color:#fff;text-decoration:none;font-weight:800}.muted{color:#667085;line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <div class="orb">✓</div>
    <h1>Saphira is <span class="gradient">activated.</span></h1>
    <p class="muted">Your Stripe checkout completed. The verified billing event will create or update your workspace and start onboarding.</p>
    <div class="steps">
      <div>✓ Payment confirmation received</div>
      <div>✓ Subscription event verified</div>
      <div>→ Workspace provisioning and welcome notification</div>
    </div>
    <a class="cta" href="/dashboard">Open Saphira Workspace</a>
  </main>
</body>
</html>
