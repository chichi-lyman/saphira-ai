plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The backend origin is injected at build time. Provider secrets never belong in the APK.
def saphiraBaseUrl = (project.findProperty('SAPHIRA_BASE_URL') ?: System.getenv('SAPHIRA_BASE_URL') ?: 'http://10.0.2.2:8000').toString().trim().replaceAll('/+$', '')
if (saphiraBaseUrl.contains('YOUR-SAPHIRA-BACKEND.example.com')) {
    throw new GradleException('SAPHIRA_BASE_URL is still a placeholder. Pass -PSAPHIRA_BASE_URL=https://your-backend.example.com for a deployable build.')
}

android {
    namespace 'ai.saphira.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.saphira.mobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    buildFeatures { compose true; buildConfig true }
    buildTypes {
        debug { buildConfigField 'String', 'SAPHIRA_BASE_URL', "\"${saphiraBaseUrl}\"" }
        release { buildConfigField 'String', 'SAPHIRA_BASE_URL', "\"${saphiraBaseUrl}\"" }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.28.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
