[package]
name = "saphira_symbolic_verifier"
version = "0.1.0"
edition = "2021"
description = "Microsecond Process-2 AST + bounds verifier for Saphira edge / Flutter"
license = "Proprietary"
authors = ["Chelsea Megan Woods <chichi-lyman>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Optional: enable when rustpython-parser version is pinned for target
# rustpython-parser = "0.3.0"
