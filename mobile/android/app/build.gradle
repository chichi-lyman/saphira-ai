plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.saphira.ai"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_1_8 }

    defaultConfig {
        applicationId = "com.saphira.ai"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Debug signing for sideloadable CI artifacts.
            // Replace with a persistent release keystore for Play Store.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    // mobile/android is one level below the Flutter project root (mobile/)
    source = "../"
}

dependencies {}
