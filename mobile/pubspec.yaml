name: saphira_ai
description: Saphira AI - Conversational assistant with background task execution. Architected by Chelsea Megan Woods.
publish_to: 'none'
version: 1.3.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
