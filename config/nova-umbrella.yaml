# Nova Umbrella Service Registry
# Owner: Chelsea Megan Woods
# Extends existing platform config — does not replace src/platform modules

version: "0.2.0"
ecosystem: nova-umbrella
owner: chelsea-megan-woods

layers:
  managed_multi_agent_runtime:
    status: partial
    modules:
      - src/core/orchestrator.py
      - src/core/swarm_orchestrator.py
      - src/core/live_orchestrator.py
      - src/core/execution_contract.py
      - agents/
    notes: "Fixed pipeline + contract; not Foundry/AgentCore managed cloud runtime"

  enterprise_identity_rbac_tenant:
    status: partial
    modules:
      - src/platform/identity/
      - src/platform/policy/
      - src/core/execution_contract.py
    notes: "RBAC + L1/L2/L3 policy exist; harden tenant isolation on all memory/tool paths"

  tool_mcp_connector_ecosystem:
    status: partial
    modules:
      - src/connectors/
      - src/integrations/
    notes: "GitHub partial; MCP-standard registry planned; all tools via AUTHORIZE"

  durable_background_jobs_recovery:
    status: partial
    modules:
      - src/commerce/states.py
      - src/core/execution_contract.py
      - src/core/self_healing.py
    notes: "Celery/Redis foundations + retries; production DLQ/task ledger next"

  memory_persistent_multitenant:
    status: partial
    modules:
      - src/platform/memory/
    notes: "Hybrid memory; enforce tenant scope + retention controls"

  observability_evaluation:
    status: partial
    modules:
      - src/platform/evidence/
      - src/core/operational_telemetry.py
      - src/commerce/leados_workflow.py
    notes: "Stage evidence exists; full Levels 1-5 harness planned"

  commerce_spend_limits_billing:
    status: implemented_phase1
    modules:
      - src/commerce/
      - src/commerce/leados_workflow.py
      - src/platform/entitlements/
    notes: "Authority + audit + Stripe verify + LeadOS under contract; no live traffic"

  voice_multimodal_native:
    status: partial
    modules:
      - src/core/saphira_voice.py
      - src/platform/voice/
      - src/core/multimodal_registry.py
    notes: "ElevenLabs + streaming foundations; outbound voice requires L1"

  self_healing_failure_injection:
    status: partial
    modules:
      - src/core/self_healing.py
      - src/core/execution_contract.py
    notes: "SelfHealingOrchestrator + contract rollback; wire into workers + Level 3 tests"

features:
  lead_os: false
  autonomous_outreach: false
  local_inference: false
  research_lab: true
  multi_model_routing: true
  cost_telemetry: true
  evaluation_gates: true
  mcp_tool_registry: false
  full_matrix_harness: false

providers:
  openai:
    enabled: true
    priority: 10
  gemini:
    enabled: true
    priority: 20
  xai:
    enabled: true
    priority: 15
  elevenlabs:
    enabled: true
    type: voice

capabilities:
  chat: true
  research: true
  voice: true
  image: true
  video: true
  workflow: true
  commerce: true

execution_contract:
  stages:
    - propose
    - validate
    - authorize
    - reserve
    - execute
    - verify
    - commit_or_rollback
  require_l1_for:
    - payment
    - outbound_message
    - deploy
    - account_change
  max_retries: 3
  idempotency: required

commerce:
  products:
    lead_os:
      default_price_usd: 199
      status: implemented_under_contract
    saphira_subscription:
      tiers: [19, 49, 99]
      status: planned
  stripe:
    webhook_signature_required: true
    idempotent_events: true

telemetry:
  track_cost_per_task: true
  track_latency_p50_p95_p99: true
  track_policy_violations: true
  track_contract_stages: true
