[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saphira-ai"
version = "0.2.0"
description = "Saphira AI monorepo — multimodal assistant and specialist agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary © 2026 Chelsea Megan Woods" }
authors = [{ name = "Chelsea Megan Woods" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  "openai>=1.30",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "langgraph>=0.2",
  "langchain-core>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
  "bandit>=1.7",
  "pip-audit>=2.7",
]
growth = [
  "openai>=1.30",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["packages", "agents", "src"]
include = ["saphira_core*", "agents*", "src*"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "agents", "src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
packages = ["saphira_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "agents"]
pythonpath = [".", "packages", "agents", "src"]
